name: naver-to-gmail

on:
  schedule:
    # 한 번 켜지면 약 5시간 40분 동안 10초마다 확인. 30분마다 다음 실행이 대기열에 들어가 이어받음.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since_date:
        description: "이 날짜부터 복사 (예: 25-Nov-2026, 비우면 최근 2일)"
        required: false
        default: ""

concurrency:
  group: naver-to-gmail
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Copy mail
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GAS_URL: ${{ secrets.GAS_URL }}
          ORDER_URL: ${{ secrets.ORDER_URL }}
          SINCE_DATE: ${{ github.event.inputs.since_date }}
          DAYS: "2"
          LOOP_MINUTES: "340"
          INTERVAL_SECONDS: "10"
        run: python copy_mail.py
