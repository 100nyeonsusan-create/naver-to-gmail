name: naver-to-gmail

on:
  schedule:
    # 한국 시간 08:00~20:59 는 20분마다, 그 외에는 1시간마다 (UTC 기준으로 적음)
    - cron: "*/20 23,0-11 * * *"
    - cron: "0 12-22 * * *"
  workflow_dispatch:
    inputs:
      since_date:
        description: "이 날짜부터 복사 (예: 25-Nov-2026, 비우면 최근 2일)"
        required: false
        default: ""

concurrency:
  group: naver-to-gmail
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy mail
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          SINCE_DATE: ${{ github.event.inputs.since_date }}
          DAYS: "2"
        run: python copy_mail.py
